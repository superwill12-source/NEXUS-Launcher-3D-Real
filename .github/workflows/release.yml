name: NEXUS Launcher - Release automática
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK de release
        run: gradle --no-daemon assembleRelease
      - name: Preparar arquivo
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/NEXUS-Launcher-${GITHUB_REF_NAME}.apk"
      - name: Criar GitHub Release e anexar APK
        uses: softprops/action-gh-release@v2
        with:
          name: "NEXUS Launcher ${{ github.ref_name }}"
          generate_release_notes: true
          files: release/NEXUS-Launcher-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
